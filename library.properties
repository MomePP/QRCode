sentence=QR code generator with a compile-time-sized C++ API: qrcode::QRCode<Version> owns its module grid and needs no heap.
paragraph=Encodes text or bytes into QR versions 1 to 40 with automatic numeric, alphanumeric or byte mode. encode() returns false and leaves a blank grid when the data does not fit. All scratch buffers are fixed-size and sized from the version at compile time. Forked from ricmoo/QRCode for the GoGo Board firmware.
